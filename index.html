<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Character Upload</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #ffe8f1, transparent 35%),
                linear-gradient(135deg, #fff5f8, #fce8f1);
            min-height: 100vh;
            color: #5c4650;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 32px;
            color: #d46f91;
            margin-bottom: 8px;
        }

        .header p {
            color: #9b7784;
            font-size: 14px;
        }

        /* Main Card */

        .card {
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(225, 156, 181, 0.3);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(190, 107, 137, 0.12);
            backdrop-filter: blur(12px);
        }

        /* Image */

        .image-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .image-preview {
            width: 190px;
            height: 250px;
            margin: 0 auto 15px;
            border-radius: 18px;
            border: 2px dashed #e8a9bf;
            background: #fff4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #c89baa;
            font-size: 14px;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .upload-btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 12px;
            background: #f4bfd1;
            color: #633d4c;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .upload-btn:hover {
            background: #ebaac1;
            transform: translateY(-2px);
        }

        #imageInput {
            display: none;
        }

        /* Form */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #76515f;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #edc4d1;
            background: rgba(255, 250, 252, 0.95);
            border-radius: 12px;
            padding: 12px 14px;
            outline: none;
            color: #604650;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s ease;
        }

        input {
            height: 44px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #dc8eaa;
            box-shadow: 0 0 0 3px rgba(220, 142, 170, 0.12);
        }

        /* Character Link */

        .link-box {
            display: flex;
            gap: 10px;
        }

        .link-box input {
            flex: 1;
        }

        /* Open Character */

        .open-character {
            margin-top: 25px;
            text-align: center;
        }

        .open-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            min-width: 210px;
            padding: 14px 25px;

            border-radius: 14px;
            border: none;

            background: linear-gradient(
                135deg,
                #e99ab7,
                #d8799e
            );

            color: white;
            text-decoration: none;

            font-size: 15px;
            font-weight: bold;

            box-shadow:
                0 8px 0 #c9658c,
                0 15px 25px rgba(210, 103, 143, 0.25);

            transition: all 0.2s ease;
        }

        .open-btn:hover {
            transform: translateY(-4px);
            box-shadow:
                0 11px 0 #c9658c,
                0 20px 30px rgba(210, 103, 143, 0.3);
        }

        .open-btn:active {
            transform: translateY(4px);
            box-shadow:
                0 3px 0 #c9658c,
                0 7px 15px rgba(210, 103, 143, 0.2);
        }

        .open-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .hint {
            margin-top: 10px;
            font-size: 12px;
            color: #aa8994;
        }

        /* Footer */

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #b18c99;
        }

        /* Mobile */

        @media (max-width: 650px) {

            body {
                padding: 20px 12px;
            }

            .card {
                padding: 18px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 27px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .link-box {
                flex-direction: column;
            }

            .image-preview {
                width: 160px;
                height: 220px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Character Upload</h1>
        <p>Create and share your character</p>
    </div>

    <div class="card">

        <!-- IMAGE -->
        <div class="image-section">

            <div class="image-preview" id="imagePreview">
                <span id="previewText">Character Image</span>
                <img id="previewImage" alt="Character Preview">
            </div>

            <label for="imageInput" class="upload-btn">
                + Chọn ảnh từ thiết bị
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

        </div>


        <!-- FORM -->
        <div class="form-grid">

            <div class="form-group">
                <label for="name">Tên nhân vật</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Nhập tên character..."
                >
            </div>


            <div class="form-group">
                <label for="gender">Giới tính</label>
                <input
                    type="text"
                    id="gender"
                    placeholder="Nam / Nữ / Khác..."
                >
            </div>


            <div class="form-group full">
                <label for="slogan">Câu slogan</label>
                <input
                    type="text"
                    id="slogan"
                    placeholder="Một câu nói đặc trưng của nhân vật..."
                >
            </div>


            <div class="form-group">
                <label for="author">Tên tác giả</label>
                <input
                    type="text"
                    id="author"
                    placeholder="Tên creator..."
                >
            </div>


            <div class="form-group">
                <label for="creatorNote">Note Creator</label>
                <input
                    type="text"
                    id="creatorNote"
                    placeholder="Ghi chú dành cho người chơi..."
                >
            </div>


            <div class="form-group full">
                <label for="plot">Plot</label>
                <textarea
                    id="plot"
                    placeholder="Mô tả bối cảnh hoặc cốt truyện..."
                ></textarea>
            </div>


            <div class="form-group full">
                <label for="description">Giới thiệu</label>
                <textarea
                    id="description"
                    placeholder="Giới thiệu về nhân vật..."
                ></textarea>
            </div>


            <div class="form-group full">
                <label for="characterLink">
                    Link Character
                </label>

                <div class="link-box">

                    <input
                        type="url"
                        id="characterLink"
                        placeholder="https://..."
                    >

                </div>
            </div>

        </div>


        <!-- OPEN CHARACTER -->
        <div class="open-character">

            <a
                href="#"
                id="openButton"
                class="open-btn disabled"
                target="_blank"
                rel="noopener noreferrer"
            >
                ✦ Open Character
            </a>

            <p class="hint">
                Nhập link character để kích hoạt nút
            </p>

        </div>

    </div>


    <div class="footer">
        Character Creator
    </div>

</div>


<script>

    /* =========================
       IMAGE UPLOAD
    ========================= */

    const imageInput = document.getElementById("imageInput");
    const previewImage = document.getElementById("previewImage");
    const previewText = document.getElementById("previewText");

    imageInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("Vui lòng chọn một file ảnh.");
            return;
        }

        const imageURL = URL.createObjectURL(file);

        previewImage.src = imageURL;
        previewImage.style.display = "block";
        previewText.style.display = "none";
    });


    /* =========================
       CHARACTER LINK
    ========================= */

    const characterLink =
        document.getElementById("characterLink");

    const openButton =
        document.getElementById("openButton");


    characterLink.addEventListener("input", function () {

        const value = this.value.trim();

        if (value === "") {

            openButton.classList.add("disabled");
            openButton.href = "#";

            return;
        }

        let url = value;

        /*
            Nếu người dùng nhập:
            example.com
            thì tự thêm https://
        */

        if (
            !url.startsWith("http://") &&
            !url.startsWith("https://")
        ) {
            url = "https://" + url;
        }

        openButton.href = url;
        openButton.classList.remove("disabled");

    });

</script>

</body>
</html>
